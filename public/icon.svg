<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#f43f5e" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#334155" stroke-width="3" stroke-opacity="0.4" />

  <!-- Radar circles in background -->
  <circle cx="256" cy="245" r="170" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="8 8" />
  <circle cx="256" cy="245" r="120" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- Shield Shape -->
  <path d="M 256 95 L 380 150 C 380 270 256 365 256 395 C 256 365 132 270 132 150 Z" 
        fill="url(#shieldGrad)" 
        filter="url(#shadow)" />

  <!-- Inner Shield Highlight -->
  <path d="M 256 112 L 362 160 C 362 260 256 345 256 370 C 256 345 150 260 150 160 Z" 
        fill="none" 
        stroke="url(#glowGrad)" 
        stroke-width="6" />

  <!-- Radar sweep / pulse line -->
  <line x1="256" y1="245" x2="350" y2="175" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.8" />

  <!-- Center AI Radar Node / Warning Badge -->
  <circle cx="256" cy="245" r="42" fill="#020617" stroke="#ffffff" stroke-width="4" />
  <circle cx="256" cy="245" r="28" fill="#f43f5e" />

  <!-- Exclamation / Radar Eye Icon -->
  <path d="M 256 226 L 256 248" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  <circle cx="256" cy="258" r="3" fill="#ffffff" />

  <!-- Subtitle badge text -->
  <text x="256" y="450" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="4" fill="#f8fafc">
    SCAMGUARD
  </text>
</svg>
